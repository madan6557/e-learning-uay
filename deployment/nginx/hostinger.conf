# Install in sites-available (inside the Nginx http context).
# Replace domain and project path; Certbot adds HTTPS after DNS is ready.
log_format uay_safe '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent';
server {
    listen 80;
    server_name elearning.example.ac.id;
    root /opt/uay-elearning/apps/web/dist;
    index index.html;
    access_log /var/log/nginx/uay-access.log uay_safe;
    client_max_body_size 2m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ~ /\. { deny all; }
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
