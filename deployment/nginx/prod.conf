events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # OIDC callback codes and signed-ticket query strings must not enter access logs.
    log_format safe '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent';
    access_log /var/log/nginx/access.log safe;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_status 429;
    client_max_body_size 2m;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    server {
        listen 80;
        server_name elearning.uay.ac.id;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://elearning.uay.ac.id$request_uri; }
    }
    server {
        listen 443 ssl;
        http2 on;
        server_name elearning.uay.ac.id;
        ssl_certificate /etc/letsencrypt/live/elearning.uay.ac.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/elearning.uay.ac.id/privkey.pem;
        ssl_protocols TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; worker-src 'self' blob:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://drive.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        location / {
            proxy_pass http://elearning-web:80;
            proxy_set_header Host $host;
        }
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://elearning-api:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://elearning-api:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
