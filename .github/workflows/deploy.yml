name: Deploy E-Learning UAY

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-elearning
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Test & Deploy (Systemd VPS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build Web, Build API & Run Tests (Parallel)
        run: |
          set -e
          echo "Starting parallel Web build, API build, and Test suite..."

          npm run build:web > /tmp/build-web.log 2>&1 &
          PID_WEB=$!

          npx tsc -p apps/api/tsconfig.json > /tmp/build-api.log 2>&1 &
          PID_API=$!

          npm test &
          PID_TEST=$!

          if ! wait $PID_WEB; then
            echo "=== Web Build Failed ==="
            cat /tmp/build-web.log
            exit 1
          fi
          echo "✓ Web build completed."

          if ! wait $PID_API; then
            echo "=== API Build Failed ==="
            cat /tmp/build-api.log
            exit 1
          fi
          echo "✓ API build completed."

          wait $PID_TEST
          echo "✓ All unit tests passed."

          test -f apps/api/dist/apps/api/src/index.js
          test -f apps/web/dist/index.html

      - name: Setup SSH with Multiplexing
        if: github.repository == 'UAY-System/e-learning'
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.UAY_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "${{ secrets.UAY_VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          cat << 'EOF' > ~/.ssh/config
          Host *
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 120s
            ServerAliveInterval 15
            ServerAliveCountMax 60
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

          ssh-keygen -F "${{ secrets.UAY_VPS_HOST }}" -f ~/.ssh/known_hosts > /dev/null

      - name: Backup current dist & Sync application to VPS
        if: github.repository == 'UAY-System/e-learning'
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            uay-deploy@${{ secrets.UAY_VPS_HOST }} '
            APP_DIR="/opt/uay/e-learning/application"
            STATE_DIR="$APP_DIR/.deploy-state"
            mkdir -p "$APP_DIR/uploads" "$STATE_DIR"
            if [ ! -f "$STATE_DIR/package-lock.sha256" ] && [ -d "$APP_DIR/node_modules/@prisma/client" ] && [ -f "$APP_DIR/package-lock.json" ]; then
              sha256sum "$APP_DIR/package-lock.json" | cut -d" " -f1 > "$STATE_DIR/package-lock.sha256"
            fi
            if [ ! -f "$STATE_DIR/schema.sha256" ] && [ -d "$APP_DIR/node_modules/.prisma/client" ] && [ -f "$APP_DIR/packages/db/prisma/schema.prisma" ]; then
              sha256sum "$APP_DIR/packages/db/prisma/schema.prisma" | cut -d" " -f1 > "$STATE_DIR/schema.sha256"
            fi
            rm -rf "$STATE_DIR/rollback-dist"
            mkdir -p "$STATE_DIR/rollback-dist"
            if [ -d "$APP_DIR/apps/api/dist" ]; then
              cp -a "$APP_DIR/apps/api/dist" "$STATE_DIR/rollback-dist/api-dist"
            fi
            if [ -d "$APP_DIR/apps/web/dist" ]; then
              cp -a "$APP_DIR/apps/web/dist" "$STATE_DIR/rollback-dist/web-dist"
            fi
          '

          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='apps/*/.env' \
            --exclude='apps/*/node_modules/' \
            --exclude='packages/*/node_modules/' \
            --exclude='uploads/' \
            --exclude='release/' \
            --exclude='docs/' \
            --exclude='tmp/' \
            --exclude='scratch/' \
            --exclude='tests/' \
            --exclude='deployment/' \
            --exclude='.deploy-state/' \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ \
            uay-deploy@${{ secrets.UAY_VPS_HOST }}:/opt/uay/e-learning/application/

      - name: Migrate, Pre-flight, Restart Systemd & Verify Health (with Auto-Rollback)
        if: github.repository == 'UAY-System/e-learning'
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            uay-deploy@${{ secrets.UAY_VPS_HOST }} '
            set -e
            cd /opt/uay/e-learning/application
            STATE_DIR="/opt/uay/e-learning/application/.deploy-state"

            rollback_dist() {
              echo "=== [AUTO-ROLLBACK] Restoring previous working dist/ build ==="
              if [ -d "$STATE_DIR/rollback-dist/api-dist" ]; then
                rm -rf /opt/uay/e-learning/application/apps/api/dist
                cp -a "$STATE_DIR/rollback-dist/api-dist" /opt/uay/e-learning/application/apps/api/dist
              fi
              if [ -d "$STATE_DIR/rollback-dist/web-dist" ]; then
                rm -rf /opt/uay/e-learning/application/apps/web/dist
                cp -a "$STATE_DIR/rollback-dist/web-dist" /opt/uay/e-learning/application/apps/web/dist
              fi
            }

            LOCK_HASH=$(sha256sum package-lock.json | cut -d" " -f1)
            SCHEMA_HASH=$(sha256sum packages/db/prisma/schema.prisma | cut -d" " -f1)
            PREV_LOCK_HASH=$(cat "$STATE_DIR/package-lock.sha256" 2>/dev/null || true)
            PREV_SCHEMA_HASH=$(cat "$STATE_DIR/schema.sha256" 2>/dev/null || true)

            NEED_PRISMA_GEN=0
            if [ ! -d node_modules/@prisma/client ] || [ "$LOCK_HASH" != "$PREV_LOCK_HASH" ]; then
              echo "=== Installing dependencies on VPS (package-lock changed or initial run) ==="
              npm ci --prefer-offline --no-audit --no-fund
              echo "$LOCK_HASH" > "$STATE_DIR/package-lock.sha256"
              NEED_PRISMA_GEN=1
            else
              echo "=== Skipping npm ci on VPS (package-lock.json unchanged) ==="
            fi

            set -a
            source /etc/uay-elearning-api
            set +a

            if [ "$NEED_PRISMA_GEN" -eq 1 ] || [ ! -d node_modules/.prisma/client ] || [ "$SCHEMA_HASH" != "$PREV_SCHEMA_HASH" ]; then
              echo "=== Generating Prisma Client on VPS ==="
              npx prisma generate --schema packages/db/prisma/schema.prisma
              echo "$SCHEMA_HASH" > "$STATE_DIR/schema.sha256"
            else
              echo "=== Skipping Prisma generate on VPS (schema.prisma unchanged) ==="
            fi

            echo "=== Applying Prisma database migrations ==="
            npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

            run_preflight() {
              node --input-type=module -e '\''
                let core;
                try {
                  core = await import("./apps/api/dist/apps/api/src/core.js");
                  console.log("[PRE-FLIGHT] core.js loaded successfully. Config port:", core.config.port);
                } catch (err) {
                  console.error("[PRE-FLIGHT] FATAL CONFIG ERROR:", err.message);
                  process.exitCode = 1;
                } finally {
                  core?.redis?.disconnect();
                  await core?.db.$disconnect();
                }
              '\''
            }

            echo "=== Pre-flight: checking core config on VPS ==="
            if ! run_preflight; then
              echo "Pre-flight failed on first attempt; running fallback npm ci + prisma generate..."
              npm ci --prefer-offline --no-audit --no-fund
              npx prisma generate --schema packages/db/prisma/schema.prisma
              if ! run_preflight; then
                rollback_dist
                exit 1
              fi
            fi

            echo "=== Restarting uay-elearning-api.service (systemd) ==="
            sudo /usr/bin/systemctl restart uay-elearning-api.service
            sudo -n /usr/bin/systemctl reload nginx || true

            HEALTH_PORT="${PORT:-3001}"
            echo "=== Verifying local systemd service & health on port $HEALTH_PORT ==="
            LOCAL_OK=0
            for i in $(seq 1 40); do
              if curl --fail --silent --show-error "http://127.0.0.1:${HEALTH_PORT}/api/health" || \
                 curl --fail --silent --show-error "http://127.0.0.1:3001/api/health"; then
                echo
                echo "Local E-Learning API health check passed (attempt $i)."
                LOCAL_OK=1
                break
              fi
              sleep 0.5
            done

            if [ "$LOCAL_OK" -ne 1 ]; then
              echo "=== LOCAL HEALTH CHECK FAILED — DUMPING DIAGNOSTICS & ROLLING BACK ==="
              systemctl status uay-elearning-api.service --no-pager -l || true
              journalctl -u uay-elearning-api.service -n 60 --no-pager || true
              rollback_dist
              sudo /usr/bin/systemctl restart uay-elearning-api.service || true
              exit 1
            fi
          '

      - name: Verify Public HTTPS Health
        if: github.repository == 'UAY-System/e-learning'
        run: |
          echo "Testing public HTTPS endpoint from GitHub Actions runner..."
          PUBLIC_OK=0
          for i in $(seq 1 20); do
            HTTP_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" https://e-learning.uay.ac.id/api/health || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Public HTTPS health check passed (HTTP 200)."
              PUBLIC_OK=1
              break
            fi
            echo "Public endpoint returned HTTP $HTTP_CODE, waiting... ($i/20)"
            sleep 1
          done

          if [ "$PUBLIC_OK" -ne 1 ]; then
            echo "=== PUBLIC HEALTH CHECK FAILED (returned HTTP $HTTP_CODE) ==="
            exit 1
          fi

