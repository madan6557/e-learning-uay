name: Deploy E-Learning UAY

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-elearning
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build Web
        run: npm run build:web

      - name: Build API
        run: npm run build:api

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to UAY VPS
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.repository == 'UAY-System/e-learning'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.UAY_DEPLOY_SSH_KEY }}" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "${{ secrets.UAY_VPS_KNOWN_HOSTS }}" \
            > ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

          cat << 'EOF' > ~/.ssh/config
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 60
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify SSH host key
        run: |
          ssh-keygen -F "${{ secrets.UAY_VPS_HOST }}" \
            -f ~/.ssh/known_hosts

      - name: Verify VPS SSH access
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            uay-deploy@${{ secrets.UAY_VPS_HOST }} \
            'whoami && hostname'

      - name: Pre-deploy VPS Diagnostics
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            uay-deploy@${{ secrets.UAY_VPS_HOST }} \
            '
            echo "=== SYSTEM UPTIME & MEMORY ==="
            uptime
            free -m
            echo "=== CURRENT LISTENING PORTS ==="
            ss -tlnp || ss -tln || true
            echo "=== SERVICE STATUS BEFORE DEPLOY ==="
            systemctl status uay-elearning-api.service --no-pager -l || true
            echo "=== RECENT SERVICE LOGS (LAST 80 LINES) ==="
            journalctl -u uay-elearning-api.service -n 80 --no-pager || sudo -n journalctl -u uay-elearning-api.service -n 80 --no-pager || true
            echo "=== SYSTEMD SERVICE UNIT CONFIG ==="
            cat /etc/systemd/system/uay-elearning-api.service || true
            echo "=== NGINX SITES CONFIG ==="
            cat /etc/nginx/sites-enabled/* || true
            echo "=== RECENT NGINX ERROR LOGS ==="
            tail -n 60 /var/log/nginx/error.log || sudo -n tail -n 60 /var/log/nginx/error.log || true
            echo "=== LOCAL PORTS PROBE ==="
            curl -I http://127.0.0.1:3000/api/health || true
            curl -I http://127.0.0.1:3001/api/health || true
            '

      - name: Prepare deployment directory
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            uay-deploy@${{ secrets.UAY_VPS_HOST }} \
            'mkdir -p /opt/uay/e-learning/application/uploads'

      - name: Sync application
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='apps/*/.env' \
            --exclude='apps/*/node_modules/' \
            --exclude='packages/*/node_modules/' \
            --exclude='uploads/' \
            --exclude='release/' \
            --exclude='docs/' \
            --exclude='tmp/' \
            --exclude='scratch/' \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ \
            uay-deploy@${{ secrets.UAY_VPS_HOST }}:/opt/uay/e-learning/application/

      - name: Install dependencies on VPS
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            uay-deploy@${{ secrets.UAY_VPS_HOST }} \
            'cd /opt/uay/e-learning/application && npm ci --no-audit --no-fund'

      - name: Generate Prisma Client and migrate database
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            uay-deploy@${{ secrets.UAY_VPS_HOST }} \
            '
            cd /opt/uay/e-learning/application

            set -a
            source /etc/uay-elearning-api
            set +a

            npx prisma generate \
              --schema packages/db/prisma/schema.prisma

            npx prisma migrate deploy \
              --schema packages/db/prisma/schema.prisma
            '

      - name: Build application on VPS
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            uay-deploy@${{ secrets.UAY_VPS_HOST }} \
            '
            set -e
            cd /opt/uay/e-learning/application && npm run build

            echo "=== Pre-flight: checking core config on VPS ==="
            set -a
            source /etc/uay-elearning-api
            set +a
            node --input-type=module -e '\''
              let core;
              try {
                core = await import("./apps/api/dist/apps/api/src/core.js");
                console.log("[PRE-FLIGHT] core.js loaded successfully. Config port:", core.config.port);
              } catch (err) {
                console.error("[PRE-FLIGHT] FATAL CONFIG ERROR:", err.message);
                process.exitCode = 1;
              } finally {
                core?.redis?.disconnect();
                await core?.db.$disconnect();
              }
            '\''
            '

      - name: Restart API service
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            uay-deploy@${{ secrets.UAY_VPS_HOST }} \
            '
            sudo /usr/bin/systemctl enable uay-elearning-api.service || true
            sudo /usr/bin/systemctl restart uay-elearning-api.service
            sudo -n /usr/bin/systemctl reload nginx || true
            '

      - name: Verify API service
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            uay-deploy@${{ secrets.UAY_VPS_HOST }} \
            '
            for i in $(seq 1 30); do
              if systemctl is-active --quiet uay-elearning-api.service; then
                echo "E-Learning API is active."
                exit 0
              fi

              echo "Waiting for E-Learning API... ($i/30)"
              sleep 1
            done

            echo "=== systemctl status uay-elearning-api.service ==="
            systemctl status uay-elearning-api.service --no-pager -l || true
            echo "=== journalctl -u uay-elearning-api.service -n 50 ==="
            journalctl -u uay-elearning-api.service -n 50 --no-pager || true
            echo "E-Learning API failed to become active."
            exit 1
            '

      - name: Verify API health
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            uay-deploy@${{ secrets.UAY_VPS_HOST }} \
            '
            HEALTH_PORT="3001"
            if [ -f /etc/uay-elearning-api ]; then
              set -a
              source /etc/uay-elearning-api
              set +a
              if [ -n "$PORT" ]; then
                HEALTH_PORT="$PORT"
              fi
            fi

            echo "Checking local health on port $HEALTH_PORT..."
            LOCAL_OK=0
            for i in $(seq 1 30); do
              if curl --fail --silent --show-error "http://127.0.0.1:${HEALTH_PORT}/api/health" || \
                 curl --fail --silent --show-error "http://127.0.0.1:3001/api/health"; then
                echo
                echo "Local E-Learning API health check passed."
                LOCAL_OK=1
                break
              fi

              echo "Waiting for E-Learning API health... ($i/30)"
              sleep 1
            done

            if [ "$LOCAL_OK" -ne 1 ]; then
              echo "=== Local health check failed ==="
              echo "=== systemctl status uay-elearning-api.service ==="
              systemctl status uay-elearning-api.service --no-pager -l || true
              echo "=== journalctl -u uay-elearning-api.service -n 60 ==="
              journalctl -u uay-elearning-api.service -n 60 --no-pager || true
              echo "E-Learning API health check failed."
              exit 1
            fi
            '

      - name: Verify Public HTTPS Health
        run: |
          echo "Testing public HTTPS endpoint from GitHub Actions runner..."
          PUBLIC_OK=0
          for i in $(seq 1 20); do
            HTTP_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" https://e-learning.uay.ac.id/api/health || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Public HTTPS health check passed (HTTP 200)."
              PUBLIC_OK=1
              break
            fi
            echo "Public endpoint returned HTTP $HTTP_CODE, waiting... ($i/20)"
            sleep 2
          done

          if [ "$PUBLIC_OK" -ne 1 ]; then
            echo "=== PUBLIC HEALTH CHECK FAILED (returned HTTP $HTTP_CODE) ==="
            exit 1
          fi
